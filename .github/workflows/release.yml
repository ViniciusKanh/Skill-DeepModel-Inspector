# Publica o instalador Windows em GitHub Releases quando uma tag v* e enviada (git push origin v1.0.0).
# Tambem pode ser executado manualmente (workflow_dispatch) para gerar artefatos sem release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tests (engine + API)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "fastapi>=0.110" "uvicorn>=0.29" "httpx>=0.27" "pytest>=8"
          python examples/generate_synthetic.py
          python -m pytest -q -m "not e2e"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          ./scripts/Build-Installer.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: DeepModelInspector-windows
          path: build/release/*
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*
          generate_release_notes: true
