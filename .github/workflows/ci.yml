# Integração contínua: testes do motor/API (Linux e Windows), testes e build da interface.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . "fastapi>=0.110" "uvicorn>=0.29" "httpx>=0.27" "pytest>=8" "ruff>=0.5"
      - run: ruff check src backend tests desktop examples tools
      - run: python -m pytest -q -m "not e2e"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
