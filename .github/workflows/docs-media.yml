# Abre o app real num navegador headless, percorre as telas, tira capturas, grava vídeo,
# gera GIF/MP4 e atualiza o README (bloco MEDIA). Usa apenas dados sintéticos e servidores
# simulados locais (sem chaves, sem internet além da instalação de dependências).
name: docs-media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "backend/**"
      - "src/**"
      - "tools/capture_media.py"

permissions:
  contents: write

concurrency:
  group: docs-media
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -e . "fastapi>=0.110" "uvicorn>=0.29" "httpx>=0.27" "pytest>=8" "playwright>=1.40"
          python -m playwright install --with-deps chromium
          cd frontend && npm ci && npm run build
      - name: End-to-end tests (browser)
        run: python -m pytest -q tests/e2e
      - name: Capture screenshots, video and GIF; update README
        run: python tools/capture_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-media
          path: |
            docs/images/screens/*.png
            docs/media/*
      - name: Commit updated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/images/screens docs/media frontend/dist
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "docs: refresh screenshots, tour video and GIF [skip ci]"
          git push
