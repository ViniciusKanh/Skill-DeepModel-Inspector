[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmodel-inspector"
version = "1.0.0"
description = "Evidence-based diagnostics for LLM training, datasets, tokenizers and generation (offline, CPU-first)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vinicius de Souza Santos" }]
license = { text = "Proprietary - see docs/LICENSE-COMMERCIAL-DRAFT.md" }
dependencies = []
classifiers = ["Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.13",
               "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]
hf = ["transformers>=4.40"]
app = ["fastapi>=0.110", "uvicorn>=0.29"]
ui-test = ["httpx>=0.27", "playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/ViniciusKanh"

[project.scripts]
deepmodel = "deepmodel_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM108", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["e2e: browser end-to-end tests (require built frontend and Playwright)"]
